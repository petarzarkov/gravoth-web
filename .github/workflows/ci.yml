# CI/CD for Gravoth Online.
#
#   check   every push and pull request: lint, format, types, every suite (the server's against a Postgres service),
#           the website build, and the image built and booted against that Postgres.
#   image   main only, after check: the server image for linux/amd64 and linux/arm64 (the Raspberry Pi) to GHCR as
#           ghcr.io/petarzarkov/gravoth-web:main and :sha-<7>, with this run's GITHUB_TOKEN. Deploying it to the Pi stays
#           a manual ./deploy-pi.sh (decision 220).
#   site    main only, after check: the website built for Cloudflare Pages (calling the API at API_ORIGIN) and deployed
#           to the Pages project behind gravoth.petarzarkov.com. Needs the repository secrets CLOUDFLARE_API_TOKEN (Pages:
#           Edit) and CLOUDFLARE_ACCOUNT_ID, set by the developer; without them the job says so and skips.
name: CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  BUN_VERSION: '1.4.5'
  IMAGE: ghcr.io/${{ github.repository_owner }}/gravoth-web
  # The API the website calls, and the Pages project it deploys to; repository variables override them.
  API_ORIGIN: ${{ vars.API_ORIGIN || 'https://gravoth-api.petarzarkov.com' }}
  PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'gravoth' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17.11-alpine
        env:
          POSTGRES_USER: gravoth
          POSTGRES_PASSWORD: gravoth-local
          POSTGRES_DB: gravoth
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U gravoth -d gravoth"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint:check
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test:contracts
      - run: bun run test:web
      - name: Server suites (Postgres from the service above)
        env:
          TEST_DATABASE_URL: postgres://gravoth:gravoth-local@127.0.0.1:55432/gravoth
        run: bun run test:server
      - name: The website, both builds (served by the API, and for Cloudflare Pages)
        run: |
          bun run build
          (cd apps/web && GRAVOTH_API_BASE="$API_ORIGIN" GRAVOTH_WEB_OUT="$RUNNER_TEMP/pages" bun run build)
          grep -q "connect-src 'self' $API_ORIGIN" "$RUNNER_TEMP/pages/_headers"
          test -f "$RUNNER_TEMP/pages/privacy/index.html"

      - name: Build the image and boot it
        run: |
          docker build -t gravoth-web:ci --build-arg COMMIT_SHA=${GITHUB_SHA::7} .
          # Production refuses the development secret, so the probe supplies a throwaway one; the database is the
          # service above, reached from the container through the host network.
          docker run -d --name gravoth-ci --network host -e PORT=3999 \
            -e DATABASE_URL=postgres://gravoth:gravoth-local@127.0.0.1:55432/gravoth \
            -e AUTH_SECRET="$(openssl rand -base64 48)" gravoth-web:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:3999/api/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3999/api/health | tee /dev/stderr | grep -q '"database":"up"'
          # The website reached the image, and its page carries its policy.
          curl -fsS -H 'accept: text/html' -D - http://127.0.0.1:3999/boards/pit_floor | grep -qi 'content-security-policy'
          curl -fsS http://127.0.0.1:3999/privacy/ | grep -q 'com.petarzarkov.gravoth'
          docker logs gravoth-ci | tail -20
          docker rm -f gravoth-ci

  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only the last stage runs as arm64 (its apt-get); the website and the dependencies build natively.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: COMMIT_SHA=${{ steps.tags.outputs.short }}
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ steps.tags.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          {
            echo "### Server image published"
            echo "- \`${IMAGE}:sha-${GITHUB_SHA::7}\` (also \`:main\`), linux/amd64 and linux/arm64"
            echo "- Deploy to the Pi by hand: \`IMAGE_TAG=sha-${GITHUB_SHA::7} ./deploy-pi.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"

  site:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Cloudflare secrets
        if: env.HAS_CLOUDFLARE != 'true'
        run: |
          echo "::notice::Not deployed: set CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID in this repository's secrets"
          echo "### Website not deployed: the Cloudflare secrets are not set" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build for Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        run: |
          bun install --frozen-lockfile --ignore-scripts
          cd apps/web && GRAVOTH_API_BASE="$API_ORIGIN" bun run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          node-version: '24'
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          gitHubToken: ${{ github.token }}
          command: >-
            pages deploy apps/web/dist
            --project-name=${{ env.PAGES_PROJECT }}
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-dirty=true
      - name: Summary
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### Website deployed"
            echo "- https://gravoth.petarzarkov.com (this deployment: $URL)"
            echo "- Calls the API at $API_ORIGIN"
          } >> "$GITHUB_STEP_SUMMARY"
