# Local development and the test suite: Postgres (the database) and Redis (the cache, the rate limit and the WebSocket relay).
# Run the API itself with `bun run dev`; `bun run test` starts its own copy of this file under the project name gravoth-server-test
# on port 55432 and removes it, volume and all, when the suite ends.
#
# The password here is a local default for a database that listens on 127.0.0.1 only. The deployed stack (compose.prod.yml)
# takes POSTGRES_PASSWORD from server/.env and refuses to start without it.
services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17.11-alpine
    environment:
      POSTGRES_USER: gravoth
      POSTGRES_DB: gravoth
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-gravoth-local}'
    ports: ['127.0.0.1:${POSTGRES_PORT:-5432}:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gravoth -d gravoth']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: public.ecr.aws/docker/library/redis:8.4.0
    ports: ['127.0.0.1:${REDIS_PORT:-6379}:6379']

volumes:
  postgres-data:
